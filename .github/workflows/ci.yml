name: Plugin CI

on:
  push:
    branches: ["main", "v2"]
  pull_request:
    branches: ["main", "v2"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp httpx pyyaml pillow pytest pytest-asyncio
      - name: Run unit tests
        run: pytest -v
